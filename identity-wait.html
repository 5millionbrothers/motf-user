<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>본인인증 연결 중 | 모티프</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-content:center;gap:20px;text-align:center;background:#fff;color:#2f3d2b;font:15px/1.6 system-ui,sans-serif}
    img{width:56px;height:42px;margin:auto}p{margin:0}.loader{width:24px;height:24px;margin:auto;border:2px solid #e4e8df;border-top-color:#465739;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loader{animation:none}}
  </style>
</head>
<body><img src="/assets/motf-symbol.svg" alt="모티프"><div class="loader" aria-hidden="true"></div><p role="status">본인인증 화면으로 연결 중입니다.</p></body>
</html>
